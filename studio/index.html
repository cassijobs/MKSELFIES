<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio — MKSELFIES</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="studio.css"></head><body><main><header><div><span class="eyebrow">MKSELFIES</span><h1>Studio</h1><p>Prepare a experiência que será revelada pela arte.</p></div><a href="../app/">Ver experiência</a></header><section class="grid"><form id="form"><label>Nome da experiência<input id="nome" maxlength="50" required></label><label>Arte do produto<input id="arte" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Frase da fotografia<textarea id="frase" maxlength="100" required></textarea></label><label>Assinatura<input id="assinatura" maxlength="45" required></label><label>Cor do efeito<input id="cor" type="color"></label><button type="submit">Salvar experiência</button><p id="status" role="status"></p></form><div class="preview"><span>Prévia</span><div id="artPreview"><b>☕</b></div><div class="ring" id="ring"></div><strong id="phrasePreview"></strong><small id="signaturePreview"></small></div></section><aside><strong>Primeira versão</strong><p>O Studio já prepara a aparência e o texto. Na próxima etapa, a arte enviada será compilada para o reconhecimento real da câmera.</p></aside></main><script src="studio.js"></script></body></html>
